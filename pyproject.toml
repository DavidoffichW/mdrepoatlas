[project]
name = "mdrepoatlas"
version = "0.2.0"
description = "Deterministic repository-to-Markdown snapshot utility"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdulaziz Alhulail" }]
keywords = [
  "codebase",
  "repository",
  "markdown",
  "snapshot",
  "documentation",
  "cli",
  "developer-tools"
]
dependencies = [
  "pathspec>=0.12.1,<1",
]

classifiers = [
  "Development Status :: 4 - Beta",

  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",

  "Environment :: Console",

  "Operating System :: OS Independent",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",

  "Topic :: Software Development",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Version Control",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/DavidoffichW/mdrepoatlas"
Repository = "https://github.com/DavidoffichW/mdrepoatlas"
Issues = "https://github.com/DavidoffichW/mdrepoatlas/issues"

[project.scripts]
mdrepoatlas = "mdrepoatlas.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "twine>=6,<7",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["c2md*", "mdrepoatlas*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
