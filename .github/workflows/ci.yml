name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run functional tests
        run: python -m pytest

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify installed wheel
        shell: bash
        run: |
          python -m venv /tmp/mdrepoatlas-wheel
          /tmp/mdrepoatlas-wheel/bin/python -m pip install dist/*.whl
          /tmp/mdrepoatlas-wheel/bin/mdrepoatlas --version
          /tmp/mdrepoatlas-wheel/bin/python -c "from mdrepoatlas import write_snapshot; assert callable(write_snapshot)"
          mkdir -p /tmp/mdrepoatlas-fixture
          printf 'print("ok")\n' > /tmp/mdrepoatlas-fixture/app.py
          /tmp/mdrepoatlas-wheel/bin/mdrepoatlas /tmp/mdrepoatlas-fixture -o - > /tmp/snapshot.md
          grep -q '### FILE: <code>app.py</code>' /tmp/snapshot.md
